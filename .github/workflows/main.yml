name: Mac Icin Derle

on:
  push:
    branches: [ main ]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v3

    - name: Python 3.11 Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter

    - name: Mac için Exe (UNIX) Derleme
      run: |
        pyinstaller --noconsole --onefile --icon=logo.ico main.py

    - name: Çıktıyı İndirilebilir Paket Yap (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: KutuphaneSistemi_Mac
        path: dist/main
